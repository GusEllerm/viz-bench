<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helios-Web · 3D points — Bench</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e6e6;
        font: 13px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden; }
      #graph { position: absolute; inset: 0; }
      #hud { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(16,20,28,.82);
        border: 1px solid #232b39; border-radius: 10px; padding: 12px 14px; min-width: 230px;
        backdrop-filter: blur(6px); }
      #hud h1 { font-size: 14px; margin: 0 0 8px; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .row span:last-child { font-variant-numeric: tabular-nums; color: #9fe0c0; }
      #hud .stage { color: #9bb; margin-top: 6px; min-height: 16px; }
      #hud .err { color: #ff8b8b; white-space: pre-wrap; margin-top: 6px; }
      select { background: #1b2330; color: #e6e6e6; border: 1px solid #2a3446; border-radius: 6px; padding: 4px 6px; }
      .legend { position: absolute; bottom: 12px; left: 12px; z-index: 10; background: rgba(16,20,28,.82);
        border: 1px solid #232b39; border-radius: 8px; padding: 8px 12px; }
      .legend span { margin-right: 12px; } .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
      a { color: #6cf; }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="hud">
      <h1>Helios-Web · 3D points · <a href="/">bench</a></h1>
      <div class="row"><label for="dataset">dataset</label>
        <select id="dataset">
          <option value="swiss_roll_100000">swiss roll · 100K pts</option>
          <option value="swiss_roll_1000000">swiss roll · 1M pts</option>
          <option value="graph_combined_umap3">graph · UMAP 3D · 139K</option>
          <option value="graph_combined_spec3">graph · spectral 3D · 139K</option>
        </select>
      </div>
      <div class="row"><span>nodes</span><span id="m-nodes">—</span></div>
      <div class="row"><span>edges</span><span id="m-edges">—</span></div>
      <div class="row"><span>fetch+parse</span><span id="m-fetch">—</span></div>
      <div class="row"><span>data prep</span><span id="m-prep">—</span></div>
      <div class="row"><span>init render</span><span id="m-init">—</span></div>
      <div class="row"><span>FPS (now / min)</span><span id="m-fps">—</span></div>
      <div class="stage" id="m-stage"></div>
      <div class="err" id="m-err"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#4C78A8"></i>cs.CV</span>
      <span><i class="dot" style="background:#F58518"></i>cs.LG</span>
      <span><i class="dot" style="background:#54A24B"></i>cs.IT</span>
      <span><i class="dot" style="background:#E45756"></i>cs.CL</span>
      <span><i class="dot" style="background:#72B7B2"></i>cs.AI</span>
      <span><i class="dot" style="background:#9aa0aa"></i>other</span>
    </div>
    <script type="module" src="/src/heliospc.js"></script>
  </body>
</html>
