<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cosmos.gl — density map (workaround)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e6e6;
        font: 13px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden; }
      #view { position: absolute; inset: 0; background: #0e1116; }
      #hud { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(16,20,28,.82);
        border: 1px solid #232b39; border-radius: 10px; padding: 12px 14px; min-width: 220px; backdrop-filter: blur(6px); }
      #hud h1 { font-size: 14px; margin: 0 0 8px; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .row span:last-child { font-variant-numeric: tabular-nums; color: #9fe0c0; }
      #hud .stage { color: #9bb; margin-top: 6px; min-height: 16px; }
      #hud .err { color: #ff8b8b; white-space: pre-wrap; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud">
      <h1>cosmos.gl · density map (workaround)</h1>
      <div class="row"><span>points</span><span id="m-points">—</span></div>
      <div class="row"><span>build</span><span id="m-load">—</span></div>
      <div class="row"><span>FPS (now / min)</span><span id="m-fps">—</span></div>
      <div class="stage" id="m-stage"></div>
      <div class="err" id="m-err"></div>
    </div>
    <script type="module" src="/src/cap-cosmos-density.js"></script>
  </body>
</html>
