<!-- Minimal repro for @cosmograph/cosmos 3.4.1 large-N scale bug.
     Usage: repro.html?n=50000000&dim=3&rescale=1&colors=1[&near=0.1&far=1000]
     Synthetic "swiss roll" cloud (seeded PRNG) with real-world-ish coords:
     x,z in about [-11.3, 11.3], y in [0, 21] — extent ~22.6 units, like the original data. -->
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#000}#graph{width:100vw;height:100vh}</style>
<div id="graph"></div>
<script src="./cosmos.min.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const N = parseInt(q.get('n') || '1000000', 10);
  const dim = parseInt(q.get('dim') || '3', 10);
  const rescale = q.get('rescale') !== '0';
  const useColors = q.get('colors') !== '0';
  const near = q.get('near') ? parseFloat(q.get('near')) : undefined;
  const far = q.get('far') ? parseFloat(q.get('far')) : undefined;

  window.repro = { ready: false, error: null, N, dim, rescale };

  try {
    // mulberry32 seeded PRNG
    let seed = 42 >>> 0;
    const rand = () => {
      seed = (seed + 0x6D2B79F5) >>> 0;
      let t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    // Swiss roll: rolled ribbon in the x-z plane, height along y.
    const positions = new Float32Array(N * dim);
    const colors = useColors ? new Float32Array(N * 4) : null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (let i = 0; i < N; i++) {
      const u = rand(), v = rand();
      const t = 1.5 * Math.PI * (1 + 2 * u);          // [4.712, 14.137]
      const x = t * Math.cos(t) * 0.8;
      const z = t * Math.sin(t) * 0.8;
      const y = 21 * v;
      if (dim === 3) {
        positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
      } else {
        positions[i * 2] = x; positions[i * 2 + 1] = z;
      }
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
      if (colors) {
        const s = (t - 4.712) / 9.425;               // 0..1 along the roll
        colors[i * 4] = 0.2 + 0.8 * s;
        colors[i * 4 + 1] = 0.3 + 0.5 * (y / 21);
        colors[i * 4 + 2] = 1.0 - 0.8 * s;
        colors[i * 4 + 3] = 1.0;
      }
    }
    window.repro.bbox = { x: [minX, maxX], y: [minY, maxY], z: [minZ, maxZ] };

    const config = {
      spaceDimensions: dim,
      enableSimulation: false,
      rescalePositions: rescale,
      fitViewOnInit: false,
      backgroundColor: '#000000',
    };
    if (near !== undefined) config.cameraNear = near;
    if (far !== undefined) config.cameraFar = far;

    const graph = new Cosmos.Graph(document.getElementById('graph'), config);
    window.repro.graph = graph;
    graph.setPointPositions(positions, { dimensions: dim });
    if (colors) graph.setPointColors(colors);
    graph.render();

    // Let the engine finish its first frames (position texture upload etc.)
    await new Promise((res) => {
      let frames = 0;
      const tick = () => { frames += 1; frames >= 20 ? res() : requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
    window.repro.ready = true;
  } catch (e) {
    window.repro.error = { name: e.name, message: e.message, stack: e.stack };
    window.repro.ready = true;
  }
})();
</script>
